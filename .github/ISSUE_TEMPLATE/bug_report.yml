name: Bug Report
description: Create a report to help us improve CoviTrack
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please fill out the sections below.
  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: A clear and concise description of the issue.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How do we reproduce this behavior?
      placeholder: |
        1. Open CoviTrack
        2. Navigate to '...'
        3. Click on '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Operating system, browser, Node.js version, Java version.
      placeholder: |
        - OS: Windows 11 / Linux / macOS
        - Browser: Chrome 124
        - Node.js: v20.x
        - Java: JDK 17

